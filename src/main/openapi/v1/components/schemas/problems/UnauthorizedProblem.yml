x-all-of-name: UnauthorizedProblem
description: >
  The client is not authenticated and needs to authenticate to get the needed permissions.
  Typical payload for the 401 Unauthorized status code.
allOf:
  - $ref: "GeneralProblem.yml"
  - type: object
    properties:
      type:
        type: string
        format: uri
        minLength: 4
        default: 'err-unauthorized'
        example: 'err-unauthorized'
      status:
        type: integer
        description: HTTP status code
        default: 401
        example: 401
    required:
      - type
      - status
